[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compass-ai"
version = "0.1.0"
description = "Discover and rank open-source beginner issues using LangGraph and Groq"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Compass AI" }]
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-groq>=0.2",
    "groq>=0.9",
    "httpx>=0.27",
    "pydantic>=2.0",
    "rich>=13.0",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "respx>=0.21",
]

[project.scripts]
compass-ai = "compass.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["compass*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
